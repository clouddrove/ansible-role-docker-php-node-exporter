---
# handlers for ansible-role-docker-php_exporter

- name: Restart php_exporter
  ansible.builtin.service:
    name: Php_exporter
    state: restarted
    enabled: true

- name: Start php_exporter
  ansible.builtin.service:
    name: Php_exporter
    state: started
    enabled: true

- name: Reload php_exporter
  ansible.builtin.service:
    name: Php_exporter
    state: reloaded
    enabled: true
